<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="login-box"><p class="eyebrow">ACCESO RESTRINGIDO</p><h1>Administración</h1><p class="muted">Ingresá con tus credenciales autorizadas.</p><form id="login-form"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button type="submit">Ingresar</button><p id="message" class="message" role="status"></p></form><a href="/">Volver al panel público</a></main><script src="/login.js" defer></script></body></html>
